services:
  # Backend Spring Boot Service
  - type: web
    name: blood-donation-backend
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-Xmx512m -Xss512k -XX:+UseContainerSupport"
    healthCheckPath: /actuator/health
    
