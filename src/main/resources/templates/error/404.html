<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | HEMO®</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0A0A0A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

        /* Animated background gradient */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(220, 38, 38, 0.1) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .error-container {
            text-align: center;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            padding: 60px 50px;
            border-radius: 24px;
            border: 1px solid #2a2a2a;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            max-width: 650px;
            width: 90%;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-brand {
            display: inline-block;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #DC2626;
            margin-bottom: 32px;
            padding: 8px 20px;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.2);
            border-radius: 50px;
        }

        .error-icon {
            font-size: 100px;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
            color: #DC2626;
            filter: drop-shadow(0 0 30px rgba(220, 38, 38, 0.5));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .error-code {
            font-size: 140px;
            font-weight: 900;
            background: linear-gradient(135deg, #DC2626 0%, #991b1b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 24px;
            letter-spacing: -0.05em;
            text-shadow: 0 0 80px rgba(220, 38, 38, 0.3);
        }

        .error-title {
            font-size: 32px;
            color: #fff;
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .error-message {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
            line-height: 1.7;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .button-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 48px;
        }

        .btn {
            padding: 16px 32px;
            font-size: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
        }

        .btn-primary {
            background: #DC2626;
            color: white;
            box-shadow: 0 8px 24px rgba(220, 38, 38, 0.4);
        }

        .btn-primary:hover {
            background: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(220, 38, 38, 0.5);
        }

        .btn-secondary {
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid #2a2a2a;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #3a3a3a;
            color: #fff;
            transform: translateY(-2px);
        }

        .suggestions {
            padding-top: 32px;
            border-top: 1px solid #2a2a2a;
        }

        .suggestions h3 {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .suggestion-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .suggestion-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .suggestion-link i {
            color: #DC2626;
            font-size: 16px;
        }

        .suggestion-link:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: #3a3a3a;
            color: #fff;
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .error-container {
                padding: 40px 24px;
            }

            .error-code {
                font-size: 100px;
            }

            .error-title {
                font-size: 24px;
            }

            .error-message {
                font-size: 14px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .suggestion-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Particles effect */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #DC2626;
            border-radius: 50%;
            opacity: 0.3;
            animation: float-particle 10s linear infinite;
        }

        @keyframes float-particle {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Animated particles -->
    <div class="particles">
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 6s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 8s;"></div>
    </div>

    <div class="error-container">
        <div class="error-brand">HEMO®</div>
        
        <div class="error-icon">
            <i class="fas fa-heart-broken"></i>
        </div>
        
        <div class="error-code">404</div>
        
        <h1 class="error-title">Page Not Found</h1>
        
        <p class="error-message">
            The page you're looking for seems to have wandered off. 
            Let's get you back on track to saving lives.
        </p>

        <div class="button-group">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i>
                Back to Home
            </a>
            <button onclick="history.back()" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i>
                Go Back
            </button>
        </div>

        <div class="suggestions">
            <h3>Quick Links</h3>
            <div class="suggestion-grid">
                <a href="/search" class="suggestion-link">
                    <i class="fas fa-search"></i>
                    Find Donors
                </a>
                <a href="/request-blood" class="suggestion-link">
                    <i class="fas fa-tint"></i>
                    Request Blood
                </a>
                <a href="/profile" class="suggestion-link">
                    <i class="fas fa-user"></i>
                    My Profile
                </a>
                <a href="/login" class="suggestion-link">
                    <i class="fas fa-sign-in-alt"></i>
                    Login
                </a>
            </div>
        </div>
    </div>

    <script>
        // Add smooth scroll behavior
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
