<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login — HEMO®</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/nav.css"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: #0A0A0A; color: #fff; font-family: 'Space Grotesk', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    .auth-page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 88px 24px 48px; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #DC2626; }
    input, select, button { font-family: 'Space Grotesk', sans-serif; }
    .input-field {
      width: 100%; background: #1C1C1C; border: 1px solid #333; color: #fff;
      border-radius: 8px; padding: 12px 16px; font-size: 0.9rem; outline: none;
      transition: border-color 300ms;
    }
    .input-field:focus { border-color: #DC2626; }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .btn-primary {
      width: 100%; background: #DC2626; color: #fff; border: none; border-radius: 8px;
      padding: 13px 16px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background 300ms; font-family: 'Space Grotesk', sans-serif;
    }
    .btn-primary:hover { background: #b91c1c; }
    label {
      display: block; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.4); margin-bottom: 8px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body class="page-auth">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-page">
<div style="width:100%;max-width:440px;">

  <!-- Logo -->
  <div style="text-align:center;margin-bottom:36px;">
    <a href="/" style="text-decoration:none;">
      <div style="font-size:2rem;font-weight:700;color:#DC2626;letter-spacing:-0.03em;">HEMO®</div>
    </a>
    <p style="color:rgba(255,255,255,0.4);font-size:0.85rem;margin-top:8px;">Welcome back</p>
  </div>

  <!-- Card -->
  <div style="background:#141414;border:1px solid #1C1C1C;border-radius:12px;padding:36px;">

    <!-- Error / Success alerts -->
    <div id="auth-error" class="hidden" style="background:rgba(220,38,38,0.12);border:1px solid rgba(220,38,38,0.3);color:#fca5a5;font-size:0.85rem;border-radius:8px;padding:12px 16px;margin-bottom:20px;">
      <span id="auth-error-msg"></span>
    </div>
    <div id="auth-success" class="hidden" style="background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);color:#86efac;font-size:0.85rem;border-radius:8px;padding:12px 16px;margin-bottom:20px;">
      <span id="auth-success-msg"></span>
    </div>

    <!-- Email/Password form -->
    <form id="login-form" style="display:flex;flex-direction:column;gap:18px;">
      <div>
        <label for="login-email">Email address</label>
        <input type="email" id="login-email" class="input-field" placeholder="you@example.com" required/>
      </div>
      <div>
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="input-field" placeholder="••••••••" required/>
      </div>
      <button type="submit" id="login-submit-btn" class="btn-primary" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;">
        <svg id="login-spinner" style="display:none;width:16px;height:16px;animation:spin 1s linear infinite;" fill="none" viewBox="0 0 24 24">
          <circle style="opacity:0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path style="opacity:0.75;" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        Sign In
      </button>
    </form>

    <p style="text-align:center;font-size:0.85rem;color:rgba(255,255,255,0.4);margin-top:24px;">
      Don't have an account?
      <a href="/register" style="color:#DC2626;font-weight:600;text-decoration:none;">Create one</a>
    </p>
  </div>
</div>
</div>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script type="module" src="/js/firebase-config.js"></script>
<script type="module" src="/js/auth-state.js"></script>
<script src="/js/redirect-handler.js"></script>
<script type="module" src="/js/auth.js"></script>

<!-- ⭐ Redirect Back Logic -->
<script>
  // Show redirect destination if saved
  window.addEventListener('DOMContentLoaded', () => {
    if (RedirectHandler.hasRedirect()) {
      const destination = RedirectHandler.peekRedirect();
      const infoDiv = document.createElement('div');
      infoDiv.style.cssText = 'background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.3);color:#93c5fd;font-size:0.85rem;border-radius:8px;padding:12px 16px;margin-bottom:20px;text-align:center;';
      infoDiv.innerHTML = `<strong><i class="fas fa-map-marker-alt"></i> Redirecting to:</strong> ${destination}`;
      
      const card = document.querySelector('.auth-page > div > div:last-child');
      card.insertBefore(infoDiv, card.firstChild);
    }
  });
</script>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
