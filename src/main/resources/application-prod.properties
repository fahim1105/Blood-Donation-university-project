spring.application.name=Blood_Donation

# ── MongoDB Atlas (Use Environment Variable) ──────────────
spring.data.mongodb.uri=${MONGODB_URI}

# ── Server ────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Thymeleaf ─────────────────────────────────────────────
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── Firebase Admin SDK ────────────────────────────────────
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:blood-donation-admin-SDK.json}

# ── Logging (Production - Less Verbose) ───────────────────
logging.level.root=INFO
logging.level.com.example.blood_donation=INFO
logging.level.org.springframework.data.mongodb=WARN

# ── Email Configuration ───────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Async Email Configuration
spring.task.execution.pool.core-size=3
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=50
